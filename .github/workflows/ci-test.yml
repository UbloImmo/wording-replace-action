name: CI Test

on:
  push:
    branches:
      - main

jobs:
  test_action:
    runs-on: ubuntu-latest
    name: Test action with sample catalog
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Run wording replace action
        uses: ./
        with:
          aliases_json: test/aliases.json
          input_catalog_po: test/input.po
          output_catalog_po: test/output.po

      - name: Compare output with expected
        run: |
          strip_po_header() {
            awk '/^#:/ { found = 1 } found' "$1"
          }

          strip_po_header test/expected_output.po > /tmp/expected_body.po
          strip_po_header test/output.po > /tmp/output_body.po
          diff -u /tmp/expected_body.po /tmp/output_body.po
