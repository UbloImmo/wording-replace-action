services:
  mysql:
    image: blksnk/morphalou-mysql
    # Skip entrypoint chown path (datadir is already mysql-owned in the image).
    user: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    # Prefer TCP (127.0.0.1) over localhost/socket so readiness matches app clients.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 5s
    ports:
      - 3306:3306

  python:
    build: ./src/python
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      retries: 30
    ports:
      - 8000:8000

  ts:
    build: ./src/ts
    working_dir: /workspace
    environment:
      API_URL: http://python:8000
    volumes:
      - ${GITHUB_WORKSPACE}:/workspace
    depends_on:
      mysql:
        condition: service_healthy
      python:
        condition: service_healthy
