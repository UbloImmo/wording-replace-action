services:
  mysql:
    image: blksnk/morphalou-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    # Use 127.0.0.1 (TCP), not localhost (unix socket). During first-boot init the
    # official MySQL image runs with --skip-networking while loading
    # /docker-entrypoint-initdb.d (~138MB here); socket pings succeed then and
    # compose --wait returns early, so dependents hit ECONNREFUSED on :3306.
    # Querying lemma also ensures init scripts finished, not just mysqld up.
    healthcheck:
      test:
        [
          "CMD",
          "mysql",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-proot",
          "-e",
          "SELECT 1 FROM morphalou.lemma LIMIT 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 300s
    ports:
      - 3306:3306

  python:
    build: ./src/python
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 2s
      retries: 30
    ports:
      - 8000:8000

  ts:
    build: ./src/ts
    working_dir: /workspace
    environment:
      API_URL: http://python:8000
    volumes:
      - ${GITHUB_WORKSPACE}:/workspace
    depends_on:
      mysql:
        condition: service_healthy
      python:
        condition: service_healthy
